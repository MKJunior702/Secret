<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi em 💗</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffd6e7, #fff0f5);
        }

        .card {
            width: 350px;
            padding: 40px;
            text-align: center;
            background: white;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .heart {
            font-size: 70px;
            animation: beat 1s infinite;
        }

        h1 {
            color: #ff4f81;
        }

        p {
            color: #555;
            font-size: 18px;
            line-height: 1.6;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            background: #ff4f81;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #ff2f69;
        }

        #message {
            display: none;
            margin-top: 20px;
            color: #ff4f81;
            font-weight: bold;
        }

        @keyframes beat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="heart">❤️</div>

        <h1>Gửi em 💌</h1>

        <p>
            Anh không biết nói những lời ngọt ngào cho lắm...
            nhưng anh biết một điều là anh rất vui
            vì có em bên cạnh. 🥰
        </p>

        <button onclick="showLove()">
            Bấm vào đây 💗
        </button>

        <div id="message">
            Anh yêu em nhiều lắm! ❤️<br>
            Cảm ơn em vì đã xuất hiện trong cuộc đời anh.
        </div>
    </div>

    <script>
        function showLove() {
            document.getElementById("message").style.display = "block";
        }
    </script>

</body>
</html>
